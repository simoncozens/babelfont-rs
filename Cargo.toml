[workspace]
resolver = "2"
members = ["babelfont", "fontmerge", "sr-aef"]

[workspace.dependencies]
log = "0.4"
env_logger = "0.10"
fontdrasil = { version = "1.0.0" }
fontir = { version = "1.0.0" }
fontbe = { version = "1.0.0" }
fontc = { version = "1.0.0", default-features = false }                      # Must use version fondrasil uses
write-fonts = { version = "0.52.0", features = ["serde", "read", "tables"] }
skrifa = { version = "0.46.2", features = ["traversal"] }
kurbo = "0.13"                                                               # Must use same version as norad / fontir /etc.
fea-rs-ast = { version = "0.1.5" }
regex = "1.12.2"
thiserror = "2.0.17"
indexmap = { version = "2.12.0", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive"] }
